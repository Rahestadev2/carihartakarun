<script>

const FBCFG={apiKey:"AIzaSyB1sfWf44Aj_SJ_tpJD6WQeQKjDuTUeiD8",authDomain:"carihartakarun.firebaseapp.com",databaseURL:"https://carihartakarun-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"carihartakarun",storageBucket:"carihartakarun.firebasestorage.app",messagingSenderId:"76271322391",appId:"1:76271322391:web:c65b6a37d5b5b13299e352"};

const $=id=>document.getElementById(id),V=(x,y,z)=>new THREE.Vector3(x,y,z);

(async()=>{try{const r=await api({action:'getMapel'});$('mapel').innerHTML=r.data.map(m=>`<option>${m}</option>`).join('');loadMateri()}catch(e){msg('Gagal memuat mapel')}})();
async function loadMateri(){try{const r=await api({action:'getMateri',mapel:$('mapel').value});$('materi').innerHTML='<option value="">Semua materi</option>'+(r.data||[]).map(m=>`<option>${m}</option>`).join('')}catch(e){}}
$('mapel').onchange=loadMateri;
function grp(id,attr,fn){[...$(id).children].forEach(b=>b.onclick=()=>{[...$(id).children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');fn(b.dataset[attr])})}
grp('gen','g',v=>gen=v);
grp('modes','m',v=>{mode=v;$('kode').classList.toggle('hide',v!=='join');$('fsoal').classList.toggle('hide',v==='join');$('cuaca').classList.toggle('hide',v==='join');$('go').textContent=v==='host'?'BUAT ROOM':v==='join'?'GABUNG':'MULAI'});
const genCode=()=>{const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';return Array.from({length:5},()=>c[Math.random()*c.length|0]).join('')};
function initFB(){if(!firebase.apps.length)firebase.initializeApp(FBCFG);db=firebase.database()}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

$('go').onclick=async()=>{
 const nama=$('nama').value.trim(),kelas=$('kelas').value.trim()||'-';
 if(!nama&&mode!=='host')return msg('Isi nama dulu');
 $('go').disabled=true;msg('Memuat soal…');
 try{
  let mapel=$('mapel').value,materi=$('materi').value,seed=Math.floor(Math.random()*1e9),n=0;
  isHost=mode==='host';
  if(mode!=='ai')initFB();
  if(mode==='join'){room=$('kode').value.trim().toUpperCase();const m=(await db.ref(`rooms/${room}/meta`).once('value')).val();
   if(!m)throw'Room tidak ditemukan';if(m.status!=='lobby')throw'Permainan sudah dimulai';mapel=m.mapel;materi=m.materi||'';seed=m.seed;n=m.n;forceW=m.w!=null?+m.w:null}
  const r=await api({action:'getSoal',mapel,materi});
  if(r.status!=='ok'||!r.data.length)throw'Soal kosong / mapel tidak valid';
  rng=mulberry(seed);const all=shuffle(r.data.slice(),rng);
  N=mode==='join'?Math.min(n,all.length):Math.min(MAXN,all.length);soal=all.slice(0,N);cfg={mapel,materi,kelas};
  if(isHost){room=genCode();const cv=$('cuaca').value;forceW=cv==='r'?Math.floor(Math.random()*6):+cv;await db.ref(`rooms/${room}/meta`).set({hostId:pid,w:forceW,mapel,materi,seed,n:N,status:'lobby',createdAt:firebase.database.ServerValue.TIMESTAMP})}
  initGame(nama||'Pengawas');
 }catch(e){msg(typeof e==='string'?e:'Gagal: '+(e.message||e));$('go').disabled=false}
};

// ---------- dunia ----------
const A=55,ARM=A-1.5; // setengah lebar arena (dulu 35)
// titik spawn tersebar (sudut emas) supaya pemain 2,3,4,... tidak menumpuk
const SP=i=>{const a=Math.PI/2+i*2.39996,r=i%2?30:40;return{x:Math.cos(a)*r,z:Math.sin(a)*r}};
const PLAYS=[{x:-14,z:-9,r:0},{x:15,z:11,r:Math.PI}],PLAYITEMS=[]; // area bermain (perosotan + ayunan)
const SPS=Array.from({length:48},(_,i)=>SP(i)),faceC=p=>Math.atan2(-p.x,-p.z);
const mat=c=>new THREE.MeshLambertMaterial({color:c}),sh=m=>(m.castShadow=m.receiveShadow=true,m);
const box=(w,h,d,c)=>sh(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)));
function buildWorld(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd3ff);scene.fog=new THREE.Fog(0x8fd3ff,130,340);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.3,520);camera.position.set(0,95,110);
 renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
 HEMI=new THREE.HemisphereLight(0xffffff,0x557744,.8);scene.add(HEMI);
 const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
 const sc=sun.shadow.camera;sc.left=sc.bottom=-50;sc.right=sc.top=50;sc.far=160;scene.add(sun,sun.target);SUN=sun;
 const g1=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mat(0x4f9f5a));g1.rotation.x=-Math.PI/2;scene.add(g1);
 const g2=new THREE.Mesh(new THREE.PlaneGeometry(2*A,2*A),mat(0x7bd26b));g2.rotation.x=-Math.PI/2;g2.position.y=.06;g2.receiveShadow=true;scene.add(g2);
 [[0,-A,2*A,.6],[0,A,2*A,.6],[-A,0,.6,2*A],[A,0,.6,2*A]].forEach(([x,z,w,d])=>{const f=box(w,1.2,d,0x9b7b4a);f.position.set(x,.6,z);scene.add(f);cols.push({a:x-w/2,b:x+w/2,c:z-d/2,d:z+d/2,on:true})});
 G1=g1;G2=g2;buildDeco();
 // titik persembunyian
 const types=['rock','crate','hut','chest','bush'],M=Math.max(N*4,22),pts=[];
 for(let g=0;pts.length<M&&g<8000;g++){const x=(rng()*2-1)*(A-6),z=(rng()*2-1)*(A-6);if(PLAYS.some(p=>Math.hypot(p.x-x,p.z-z)<14)||SPS.some(p=>Math.hypot(p.x-x,p.z-z)<7)||pts.some(p=>Math.hypot(p.x-x,p.z-z)<9))continue;pts.push({x,z})}
 const tset=shuffle(pts.map((_,i)=>i),rng).slice(0,N);
 pts.forEach((p,i)=>spots.push(buildSpot(types[i%5],p.x,p.z,tset.indexOf(i),rng()*Math.PI*2)));
 buildArena(pts);
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}
function buildSpot(t,x,z,has,dir){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const s={t,x,z,ix:x,iz:z+1.9,g,has,dir,open:false,a:0,cs:[]};
 const col=(a,b,c,d,own)=>{const o={a,b,c,d,on:true};cols.push(o);if(own)s.cs.push(o);return o};
 if(t==='rock'){const m=sh(new THREE.Mesh(new THREE.DodecahedronGeometry(1.25),mat(0x8a8f96)));m.scale.y=.8;m.position.y=.9;g.add(m);col(x-1.2,x+1.2,z-1.2,z+1.2,1)}
 else if(t==='crate'){const m=box(1.8,1.8,1.8,0xb0773a);m.position.y=.9;const b=box(1.86,.2,1.86,0x7a4a1e);b.position.y=.9;g.add(m,b);col(x-.95,x+.95,z-.95,z+.95,1)}
 else if(t==='hut'){
  [[0,-1.5,3.2,.3],[-1.5,0,.3,3.2],[1.5,0,.3,3.2]].forEach(([a,b,w,d])=>{const m=box(w,2.6,d,0xc9a66b);m.position.set(a,1.3,b);g.add(m);col(x+a-w/2,x+a+w/2,z+b-d/2,z+b+d/2)});
  [-1.35,1.35].forEach(a=>{const m=box(.5,2.6,.3,0xb08a50);m.position.set(a,1.3,1.5);g.add(m);col(x+a-.25,x+a+.25,z+1.35,z+1.65)});
  const p=new THREE.Group();p.position.set(-1.1,0,1.5);const d=box(2.2,2.4,.15,0x7a4a1e);d.position.set(1.1,1.2,0);p.add(d);g.add(p);s.door=p;col(x-1.1,x+1.1,z+1.35,z+1.65,1);s.iz=z+2.6}
 else if(t==='chest'){const b=box(1.6,.8,1,0x8b5a2b);b.position.y=.4;const p=new THREE.Group();p.position.set(0,.8,-.5);const l=box(1.6,.3,1,0xa8742f);l.position.set(0,.15,.5);p.add(l);g.add(b,p);s.lid=p;col(x-.9,x+.9,z-.6,z+.6)}
 else{[[0,.8,0,1.1],[.7,.6,.4,.8],[-.7,.6,-.3,.8]].forEach(([a,b,c,r])=>{const m=sh(new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat(0x2f8f3f)));m.position.set(a,b,c);g.add(m)});col(x-1,x+1,z-1,z+1,1)}
 return s;
}
const hit=(x,z)=>{for(const c of cols)if(c.on&&x>c.a-.4&&x<c.b+.4&&z>c.c-.4&&z<c.d+.4)return true;return false};
function moveEnt(e,dx,dz){let n=e.x+dx;if(!hit(n,e.z))e.x=n;n=e.z+dz;if(!hit(e.x,n))e.z=n;e.x=Math.max(-ARM,Math.min(ARM,e.x));e.z=Math.max(-ARM,Math.min(ARM,e.z))}
const ease=e=>1-Math.pow(1-e,3);
function spotAnim(s,dt){
 if(s.open&&s.a<1){s.a=Math.min(1,s.a+dt*1.4);const e=ease(s.a);
  if(s.t==='rock'||s.t==='crate'){s.g.position.set(s.x+Math.cos(s.dir)*2.5*e,0,s.z+Math.sin(s.dir)*2.5*e);if(s.t==='rock')s.g.children[0].rotation.x=e*5}
  else if(s.t==='hut')s.door.rotation.y=-e*1.9;else if(s.t==='chest')s.lid.rotation.x=-e*1.9;
  else{s.g.scale.setScalar(1-.8*e);s.g.position.y=-.5*e}}
 if(s.tr){if(s.gone){s.tr.scale.multiplyScalar(1-6*dt);if(s.tr.scale.x<.03){scene.remove(s.tr);s.tr=null}}
  else{s.trT+=dt;const k=Math.min(1,Math.max(0,(s.trT-.4)*2.5));s.tr.scale.set(k,k*1.4,k);s.tr.rotation.y+=dt*2.2;s.tr.position.y=s.by+Math.sin(s.trT*3)*.1}}
}
function makeGem(){return new THREE.Mesh(new THREE.OctahedronGeometry(.45),new THREE.MeshStandardMaterial({color:0xffd23f,emissive:0xffa800,emissiveIntensity:.9,metalness:.6,roughness:.3}))}

// ---------- karakter ala Roblox ----------
let _ft;const faceTex=()=>_ft||(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#f5cd30';x.fillRect(0,0,64,64);x.fillStyle='#222';x.fillRect(16,20,7,10);x.fillRect(41,20,7,10);x.lineWidth=3;x.strokeStyle='#222';x.beginPath();x.arc(32,36,12,.2,Math.PI-.2);x.stroke();return _ft=new THREE.CanvasTexture(c)})();
function label(t){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 34px sans-serif';x.textAlign='center';x.fillStyle='#0008';x.fillRect(0,8,256,48);x.fillStyle='#fff';x.fillText(t.slice(0,14),128,44);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(3.2,.8,1);s.position.y=3.4;return s}
function makeChar(g,name){
 const G=new THREE.Group(),F=g==='P',skin=0xf5cd30,shirt=F?0xe84a9a:0x2f6fed,pants=F?0x5b3a8a:0x3a8a3a,hair=F?0x6b3410:0x3b2414;
 const limb=(x,y,w,h,c)=>{const p=new THREE.Group();p.position.set(x,y,0);const m=box(w,h,.42,c);m.position.y=-h/2;p.add(m);G.add(p);return p};
 const legs=[limb(-.22,.8,.42,.8,pants),limb(.22,.8,.42,.8,pants)],arms=[limb(-.67,1.7,.38,.85,skin),limb(.67,1.7,.38,.85,skin)];
 const t=box(.9,.9,.45,shirt);t.position.y=1.25;G.add(t);

// ---------- dekorasi dalam arena ----------
const GT={value:0},TC=new THREE.Color(),PM=[],GV=[];
function buildArena(pts){
 const R=mulberry(20240611),rr=(a,b)=>a+R()*(b-a),E=A-3,dec=[],ponds=[];
 const M=(g,m,x,y,z,p)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);(p||scene).add(o);return o};
 const free=(x,z,r,sp)=>Math.abs(x)<E&&Math.abs(z)<E&&!pts.some(p=>Math.hypot(p.x-x,p.z-z)<sp)&&!SPS.some(q=>Math.hypot(q.x-x,q.z-z)<r+2.5)&&!dec.some(d=>Math.hypot(d[0]-x,d[1]-z)<d[2]+r);
 const place=(r,sp,fn,tries=40)=>{for(let i=0;i<tries;i++){const x=rr(-E,E),z=rr(-E,E);if(free(x,z,r,sp)){dec.push([x,z,r]);fn(x,z);return true}}return false};
 const col=(x,z,hx,hz)=>cols.push({a:x-hx,b:x+hx,c:z-hz,d:z+hz,on:true});
 const inPond=(x,z)=>ponds.some(p=>Math.hypot(p[0]-x,p[1]-z)<6.4)||PLAYS.some(p=>Math.hypot(p.x-x,p.z-z)<12);
 MMD.p.length=MMD.t.length=MMD.b.length=0;PLAYITEMS.length=0;PLAYS.forEach((pl,i)=>{dec.push([pl.x,pl.z,13]);buildPlay(pl,i)});
 // bercak tanah berwarna (variasi rumput)
 [0x6cc45e,0x86d977,0x5fb552,0xa8c97a].forEach((c,k)=>{const m=mat(c);m.userData.b=c;PM.push(m);
  for(let i=0;i<12;i++){const o=M(new THREE.CircleGeometry(rr(3,9),20),m,rr(-A+4,A-4),.08+(k*12+i)*.0007,rr(-A+4,A-4));o.rotation.x=-Math.PI/2;o.receiveShadow=true}});
 // kolam
 const wm=new THREE.MeshLambertMaterial({color:0x3a9fd8,transparent:true,opacity:.85}),sm=mat(0x8a8a8a),lm=mat(0x3f9b4a);
 for(let k=0;k<3;k++)place(7.5,10,(x,z)=>{ponds.push([x,z]);MMD.p.push([x,z]);M(new THREE.CylinderGeometry(5.5,5.5,.3,28),wm,x,.15,z);
  for(let i=0;i<16;i++){const a=i/16*6.283;M(new THREE.SphereGeometry(rr(.5,.85),6,5),sm,x+Math.cos(a)*5.8,.25,z+Math.sin(a)*5.8)}
  for(let i=0;i<5;i++){const a=rr(0,6.28),d=rr(0,4);M(new THREE.CylinderGeometry(.7,.7,.05,10),lm,x+Math.cos(a)*d,.33,z+Math.sin(a)*d)}
  col(x,z,4.4,4.4)});
 // pohon
 const tk=mat(0x7a5230),tg=[mat(0x2e8b3e),mat(0x3da34d),mat(0x1f6f35)],gT=new THREE.CylinderGeometry(.3,.42,2,6),gC=new THREE.ConeGeometry(1.8,4.5,7),gS=new THREE.SphereGeometry(1.9,8,6);
 for(let i=0;i<80;i++)place(2.2,5.5,(x,z)=>{MMD.t.push([x,z]);const s=rr(.8,1.5),t=M(gT,tk,x,s,z);t.scale.setScalar(s);t.castShadow=true;const l=M(i%2?gC:gS,tg[i%3],x,(i%2?4.2:3.6)*s,z);l.scale.setScalar(s);l.castShadow=true;col(x,z,.5*s,.5*s)});
 // batu besar
 const gB=new THREE.DodecahedronGeometry(1),bm=[mat(0x8a8f96),mat(0x777c83),mat(0x9a9ea5)];
 for(let i=0;i<24;i++)place(2.4,5,(x,z)=>{MMD.b.push([x,z]);const s=rr(.6,1.6),m=M(gB,bm[i%3],x,s*.6,z);m.scale.set(s,s*.7,s*rr(.8,1.2));m.rotation.y=rr(0,6);m.castShadow=m.receiveShadow=true;col(x,z,s*.85,s*.85)});
 // batang kayu tumbang
 const lg=new THREE.CylinderGeometry(.45,.45,3.2,8),lm2=mat(0x6b4423);
 for(let i=0;i<14;i++)place(2.4,4,(x,z)=>{const q=i%2,g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=q?Math.PI/2:0;scene.add(g);const m=new THREE.Mesh(lg,lm2);m.position.y=.45;m.rotation.z=Math.PI/2;m.castShadow=true;g.add(m);col(x,z,q?.55:1.7,q?1.7:.55)});
 // tunggul
 const gU=new THREE.CylinderGeometry(.7,.85,.8,8),um=mat(0x8a5a2b);
 for(let i=0;i<16;i++)place(1.4,4,(x,z)=>{const m=M(gU,um,x,.4,z);m.castShadow=true;M(new THREE.CylinderGeometry(.62,.62,.05,8),mat(0xd9b27c),x,.82,z);col(x,z,.8,.8)});
 // jamur
 const ms=mat(0xf4efe0),mc=mat(0xd63a3a),gM=new THREE.CylinderGeometry(.08,.1,.3,6),gH=new THREE.SphereGeometry(.25,8,6);
 for(let i=0;i<45;i++)place(.7,3.5,(x,z)=>{for(let k=0;k<3;k++){const dx=rr(-.4,.4),dz=rr(-.4,.4),s=rr(.7,1.3);M(gM,ms,x+dx,.15*s,z+dz).scale.setScalar(s);M(gH,mc,x+dx,.32*s,z+dz).scale.set(s,.6*s,s)}});
 // bunga (instanced)
 const fcol=[0xff6b6b,0xffd23f,0xffffff,0xc77dff,0xff9ecf],dm=new THREE.Object3D(),fp=[];
 while(fp.length<700){const x=rr(-E-1,E+1),z=rr(-E-1,E+1);if(!inPond(x,z))fp.push([x,z])}
 const fm=new THREE.InstancedMesh(new THREE.SphereGeometry(.2,6,5),new THREE.MeshLambertMaterial(),fp.length);fm.frustumCulled=false;
 fp.forEach(([x,z],i)=>{dm.position.set(x,.45,z);dm.updateMatrix();fm.setMatrixAt(i,dm.matrix);fm.setColorAt(i,TC.set(fcol[i%5]))});fm.instanceColor.needsUpdate=true;scene.add(fm);GV.push(fm);
 // rumput (instanced, bergoyang)
 const pos=[],nor=[];
 for(let i=0;i<6;i++){const a=i/6*6.283+rr(0,1),ox=Math.cos(a)*.18,oz=Math.sin(a)*.18,h=rr(.55,1.1),lx=Math.cos(a)*rr(.1,.3),lz=Math.sin(a)*rr(.1,.3),px=-Math.sin(a)*.07,pz=Math.cos(a)*.07;
  pos.push(ox-px,0,oz-pz,ox+px,0,oz+pz,ox+lx,h,oz+lz);nor.push(0,1,0,0,1,0,0,1,0)}
 const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));gg.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
 const gm=new THREE.MeshLambertMaterial({side:THREE.DoubleSide});
 gm.onBeforeCompile=sd=>{sd.uniforms.uT=GT;sd.vertexShader=sd.vertexShader.replace('#include <common>','#include <common>\nuniform float uT;').replace('#include <begin_vertex>','#include <begin_vertex>\n#ifdef USE_INSTANCING\nfloat gw=sin(uT*1.6+instanceMatrix[3].x*.35+instanceMatrix[3].z*.27);transformed.x+=gw*position.y*.22;transformed.z+=gw*position.y*.1;\n#endif')};
 const gp=[];
 while(gp.length<1700){const x=rr(-E-1,E+1),z=rr(-E-1,E+1);if(!inPond(x,z))gp.push([x,z])}
 for(let c=0;c<130;c++){const cx=rr(-E,E),cz=rr(-E,E);for(let k=0;k<22;k++){const a=rr(0,6.28),d=rr(0,3.5),x=cx+Math.cos(a)*d,z=cz+Math.sin(a)*d;if(Math.abs(x)<E+1&&Math.abs(z)<E+1&&!inPond(x,z))gp.push([x,z])}}
 const gc=[0x4aa84f,0x5fbf55,0x3f9a45,0x7ccf5f,0x6bb34a],gi=new THREE.InstancedMesh(gg,gm,gp.length);gi.frustumCulled=false;
 gp.forEach(([x,z],i)=>{const s=rr(.7,1.7);dm.position.set(x,0,z);dm.rotation.y=rr(0,6.28);dm.scale.set(s,s*rr(.8,1.4),s);dm.updateMatrix();gi.setMatrixAt(i,dm.matrix);gi.setColorAt(i,TC.set(gc[i%5]))});
 gi.instanceColor.needsUpdate=true;scene.add(gi);GV.push(gi);
 buildMM();
}

// ---------- loop ----------
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta());update(dt);renderer.render(scene,camera)}
function update(dt){
 const now=Date.now()+offset,t=now/1000;
 if(state==='intro'&&now>=T0){state='play';camMode=isHost?'spec':'follow'}
 if(state==='play'||state==='question'){
  const left=Math.max(0,DUR-(now-T0)/1000);$('timer').textContent=`${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}`;
  if(left<=0||(found>=N&&state==='play')){end();return}
 }
 nearS=null;
 if(me){
  if(state==='play'&&!me.act){
   let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+jx,dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+jz;const l=Math.hypot(dx,dz);
   if(CAMS[camT].fp&&camMode==='follow'){me.r-=dx*2.6*dt;const f=Math.max(-1,Math.min(1,-dz));me.moving=Math.abs(f)>.12;if(me.moving)moveEnt(me,Math.sin(me.r)*f*6*dt,Math.cos(me.r)*f*6*dt)}
   else{me.moving=l>.12;if(me.moving){if(l>1){dx/=l;dz/=l}moveEnt(me,dx*6*dt,dz*6*dt);me.r=Math.atan2(dx,dz)}}
   let bd=2.5;for(const s of spots)if(!s.open){const d=Math.hypot(me.x-s.ix,me.z-s.iz);if(d<bd){bd=d;nearS=s}}
   let pd=bd;nearP=null;for(const it of PLAYITEMS){const d=Math.hypot(me.x-it.ix,me.z-it.iz);if(d<pd){pd=d;nearP=it}}if(nearP)nearS=null;
  }else if(me.act){
   const P=actPose(me.act,now);
   if(P.done)endAct(P);
   else{me.pose=P;me.x=P.x;me.z=P.z;me.r=P.r;me.moving=false;
    if(me.act.it.k==='swing'&&state==='play'){const mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+jx,mz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+jz;if(Math.hypot(mx,mz)>.35)dismount()}}
  }else me.moving=false;
 }
 if(me&&!me.act)me.pose=null;
 if(me&&!me.act){me.y=me.y||0;if(me.y>0){me.vy-=26*dt;me.y=Math.max(0,me.y+me.vy*dt);if(!me.y)me.vy=0}}
 const sw=me&&me.act&&me.act.it.k==='swing';
 $('act').classList.toggle('dim',!(nearS||nearP||sw));$('act').textContent=me&&me.act?(sw?'⬇️ Turun (E)':'🛝 Meluncur…'):nearP?(nearP.k==='slide'?'🛝 Main perosotan (E)':'🪑 Main ayunan (E)'):nearS?'🖐 '+LBL[nearS.t]+' (E)':'🖐 Buka (E)';
 if(state==='play'||state==='question')bots.forEach(b=>botThink(b,dt));
 for(const k in remotes){const r=remotes[k];
  if(r.actD&&PLAYITEMS[r.actD.i]){const P=actPose({it:PLAYITEMS[r.actD.i],t0:r.actD.t,sx:r.actD.x,sz:r.actD.z},now);if(!P.done){r.pose=P;r.x=P.x;r.z=P.z;r.r=P.r;r.moving=false;continue}}
  r.pose=null;const dx=r.tx-r.x,dz=r.tz-r.z,f=Math.min(1,dt*10);r.moving=Math.hypot(dx,dz)>.05;r.x+=dx*f;r.z+=dz*f;r.r=r.tr}
 if((mmT+=dt)>.1){mmT=0;drawMM()}
 fxUpdate(dt);swingVis(dt);everyone().forEach(e=>anim(e,dt));spots.forEach(s=>spotAnim(s,dt));deco(dt);
 // kamera
 let p,l,k=2.5;const rk=Object.keys(remotes);
 if(camMode==='close'&&closeSpot){const s=closeSpot;p=V(s.x+1.8,2.3,s.z+4.6);l=V(s.x,.9,s.z);k=4}
 else if(camMode==='follow'&&me){const c=camFor(me);p=c.p;l=c.l;k=c.k}
 else if(camMode==='spec'&&rk.length){const r=remotes[rk[specIdx%rk.length]];$('specname').textContent=r.name;const c=camFor(r);p=c.p;l=c.l;k=c.k}
 else{const a=state==='intro'?0:t*.12;p=V(Math.sin(a)*82,62,Math.cos(a)*82+(state==='intro'?12:0));l=V(0,0,0)}
 const f=1-Math.exp(-k*dt);camera.position.lerp(p,f);look.lerp(l,f);camera.lookAt(look);
 {const fp=CAMS[camT].fp,sp=camMode==='spec'&&rk.length?remotes[rk[specIdx%rk.length]]:null;if(me)me.mesh.visible=!(fp&&camMode==='follow');for(const kk in remotes)remotes[kk].mesh.visible=!(fp&&remotes[kk]===sp)}
 if(SUN){const sx=Math.round(look.x/2)*2,sz=Math.round(look.z/2)*2;SUN.target.position.set(sx,0,sz);SUN.position.set(sx+30,50,sz+20)}
 if((scT+=dt)>.4){scT=0;$('found').textContent=`💎 Harta ditemukan ${found}/${N}`;
  $('score').innerHTML='⭐ Skor<br>'+everyone().sort((a,b)=>b.stars-a.stars).map(p=>`${p.name}${p===me?' (kamu)':''}: ${p.stars}`).join('<br>')}
}
