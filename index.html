<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Harta Karun 3D</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;overflow:hidden;background:#8fd3ff;user-select:none;touch-action:none}
canvas{display:block;width:100vw;height:100vh}.hide{display:none!important}
.ov{position:fixed;inset:0;background:rgba(10,30,50,.55);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;z-index:10}
.card{background:#fff;border-radius:18px;padding:20px;max-width:440px;width:100%;box-shadow:0 10px 40px #0005}
h1{font-size:23px;text-align:center;margin-bottom:10px}
input,select,textarea{width:100%;padding:11px;margin:4px 0;border:2px solid #cde;border-radius:10px;font-size:15px}
button{font:inherit;cursor:pointer}
.row{display:flex;gap:6px;margin:6px 0}.row button{flex:1;padding:10px 4px;border:2px solid #cde;border-radius:10px;background:#f4f8fb}
.row button.sel{background:#ffd23f;border-color:#e0a800;font-weight:700}
.big{width:100%;padding:14px;margin-top:8px;border:0;border-radius:12px;background:#e8590c;color:#fff;font-size:18px;font-weight:700}
.big:disabled{opacity:.5}#msg{color:#c0392b;font-size:13px;text-align:center;margin-top:6px;min-height:16px}
.hud{position:fixed;z-index:5;color:#fff;text-shadow:0 2px 4px #000a;font-weight:700}
#timer{top:10px;left:50%;transform:translateX(-50%);font-size:30px;background:#0007;padding:4px 18px;border-radius:12px}
#found{top:64px;left:50%;transform:translateX(-50%);font-size:14px;white-space:nowrap}
#score{top:10px;right:10px;background:#0006;padding:8px 12px;border-radius:10px;font-size:13px;min-width:130px}
#toast{top:100px;left:50%;transform:translateX(-50%);font-size:18px;text-align:center;pointer-events:none;width:90%}
#act{bottom:40px;right:30px;padding:16px 22px;border:0;border-radius:16px;background:#ffd23f;color:#222;font-size:16px;text-shadow:none;box-shadow:0 4px 12px #0006}
#joy{display:block;touch-action:none;backdrop-filter:blur(4px);bottom:30px;left:30px;width:110px;height:110px;border-radius:50%;background:#fff3;border:2px solid #fff8}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffc}
.dim{opacity:.5}#jump{bottom:112px;right:36px;width:64px;height:64px;border-radius:50%;border:0;background:#fffd;font-size:26px;box-shadow:0 4px 12px #0006}#cbtn{top:52px;left:108px;padding:8px 12px;border:0;border-radius:10px;background:#0006;color:#fff;backdrop-filter:blur(4px);font-size:13px}#cmenu{top:94px;left:10px;z-index:7;background:#000c;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px}#cmenu button{border:0;border-radius:8px;padding:9px 14px;text-align:left;font-size:14px;background:#fff2;color:#fff;white-space:nowrap}#cmenu button.sel{background:#ffd23f;color:#222}#mm{top:94px;left:10px;width:150px;height:150px;border-radius:12px;border:2px solid #fffa;background:#0006;box-shadow:0 3px 10px #0006;cursor:pointer;transition:width .2s,height .2s}#mm.big{width:260px;height:260px}#mbtn{top:52px;left:10px;padding:8px 12px;border:0;border-radius:10px;background:#0006;color:#fff;backdrop-filter:blur(4px);font-size:13px}#wbtn{top:10px;left:10px;padding:8px 12px;border:0;border-radius:10px;background:#0006;color:#fff;backdrop-filter:blur(4px);font-size:13px}
#spec{bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
#spec button{padding:8px 14px;border:0;border-radius:8px}
#qt{font-size:17px;font-weight:700;margin:6px 0}#qm{font-size:12px;color:#888}#qi{max-width:100%;max-height:160px;display:block;margin:6px auto;border-radius:8px}
#qo button{display:block;width:100%;text-align:left;padding:11px;margin:6px 0;border:2px solid #cde;border-radius:10px;background:#f4f8fb;font-size:15px}
#qo .ok{background:#8bd98b!important}#qo .no{background:#f19a9a!important}
#lcode{color:#e8590c;letter-spacing:4px}#llist{margin:8px 0 8px 20px}ol{margin:8px 0 8px 22px}
#cm{bottom:150px;left:30px;padding:8px 12px;border:0;border-radius:10px;background:#1e8449cc;color:#fff;font-size:13px;text-shadow:none}#cm.off{background:#c0392bcc}
#talk{bottom:100px;left:50%;transform:translateX(-50%);padding:10px 16px;border:0;border-radius:14px;background:#2ecc71;color:#fff;font-size:15px;box-shadow:0 4px 12px #0006;text-shadow:none;white-space:nowrap}#talk.off{background:#e74c3c}
#duel .card{text-align:center}#dt{font-weight:700;font-size:17px}#ds{font-size:22px;margin:6px 0;font-weight:700}#dv{font-size:48px;min-height:64px}#dm{min-height:22px;margin:4px 0 8px;font-size:14px;color:#555}#dp button{font-size:20px}
#conf{position:fixed;inset:0;z-index:12;pointer-events:none}
#end .card{text-align:center;max-height:96vh;overflow:auto}
#champ{opacity:0;transform:scale(.3);margin:4px 0}#champ.show{animation:pop 1s cubic-bezier(.2,1.6,.4,1) forwards}
#champ .tr{font-size:64px;display:block;animation:bob 1.2s ease-in-out infinite}#champ b{font-size:22px;color:#e8590c;display:block}#champ small{color:#666}
@keyframes pop{to{opacity:1;transform:scale(1)}}@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
#pod{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:10px 0 6px;min-height:150px}
.pc{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;font-size:13px}
.pc .pn{font-weight:700;word-break:break-word;opacity:0;animation:fadein .5s forwards}.pc .pk{font-size:34px;opacity:0;animation:fadein .5s forwards}
.pc .bl{width:100%;border-radius:10px 10px 0 0;transform:scaleY(0);transform-origin:bottom;animation:rise .8s cubic-bezier(.2,1.2,.4,1) forwards;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 4px #0006}
.pc.p1 .bl{height:110px;background:linear-gradient(#ffd23f,#e0a800)}.pc.p2 .bl{height:80px;background:linear-gradient(#cfd8dc,#90a4ae)}.pc.p3 .bl{height:60px;background:linear-gradient(#e0a070,#b0703c)}
@keyframes rise{to{transform:scaleY(1)}}@keyframes fadein{to{opacity:1}}
#rank li.me{font-weight:700;color:#e8590c}#svst{font-size:13px;margin:6px 0;min-height:18px}
#digp,#dishp{bottom:200px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;padding:8px 16px;border-radius:12px;font-size:14px;text-align:center;min-width:210px}
#dishp{max-width:88vw;min-width:260px;line-height:1.35}
#okflash{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,#fffbe0 0,#ffe27acc 28%,#ffd23f55 55%,transparent 80%)}#okflash.go{animation:okf 1s ease-out}@keyframes okf{0%{opacity:0}12%{opacity:1}35%{opacity:.55}50%{opacity:.8}100%{opacity:0}}
#cover{position:fixed;inset:0;z-index:50;background:#0b2a1a;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:opacity .45s}#cover.out{opacity:0;pointer-events:none}
#cbg{position:absolute;inset:-30px;background-position:center;background-size:cover;filter:blur(24px) brightness(.55)}
#cpic{position:relative;width:min(100vw,calc(100dvh*1792/2400));aspect-ratio:1792/2400;box-shadow:0 0 50px #000a}#cpic img{display:block;width:100%;height:100%}
#cgo{position:absolute;left:66%;top:90.3%;width:32%;height:6.2%;border:0;border-radius:14px;background:transparent;animation:cglow 1.6s ease-in-out infinite}
@keyframes cglow{0%,100%{box-shadow:0 0 0 0 #ffd23f00}50%{box-shadow:0 0 18px 6px #ffd23faa}}
#lcopy{display:block;margin:0 auto 8px;padding:9px 18px;border:2px solid #e0a800;border-radius:10px;background:#ffd23f;font-weight:700;font-size:14px}#lcopy.ok{background:#8bd98b;border-color:#4caf50}
.pbar{height:8px;background:#fff3;border-radius:5px;margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:#ffd23f}
#cavefx{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(30,10,0,0) 28%,rgba(12,5,0,.55) 70%,rgba(0,0,0,.85) 100%)}
#hurt{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(230,30,30,.75) 100%)}#hurt.go{animation:hurtf .7s ease-out}@keyframes hurtf{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

.row2{display:flex;gap:8px;margin-top:4px}.row2 label{flex:1;font-size:12px;color:#456;font-weight:600}.row2 select{margin-top:2px}
textarea{font:inherit;resize:none;user-select:text;-webkit-user-select:text}
#abtn{bottom:20px;right:14px;padding:10px 14px;border:0;border-radius:12px;background:#e8590c;color:#fff;font-size:14px;box-shadow:0 4px 12px #0006;text-shadow:none}
#lann{width:100%;margin:6px 0;padding:10px;border:2px solid #e8590c;border-radius:10px;background:#fff4ec;color:#c2410c;font-weight:700}
#linfo{text-align:center;font-weight:700;color:#456;margin:4px 0}
#anbox{z-index:20}#anbox .card h1{font-size:20px}#anmsg{color:#c0392b;font-size:13px;min-height:16px}
#anq{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}#anq button{flex:1 1 auto;padding:7px 8px;border:2px solid #cde;border-radius:10px;background:#f4f8fb;font-size:12px}
#ancnt{font-size:11px;color:#888;text-align:right}
#ann{position:fixed;z-index:15;top:140px;left:50%;transform:translateX(-50%);width:min(92vw,520px);background:linear-gradient(#ffe27a,#ffc93c);color:#3a2a00;border:3px solid #e0a800;border-radius:16px;padding:12px 16px;box-shadow:0 8px 28px #0007;font-size:17px;line-height:1.35;text-align:center;cursor:pointer;animation:annin .45s cubic-bezier(.2,1.5,.4,1)}
#ann b{display:block;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:#a04a00;margin-bottom:3px}#ann span{font-weight:700;word-break:break-word}
@keyframes annin{from{opacity:0;transform:translate(-50%,-30px) scale(.8)}}
#runb{bottom:190px;right:36px;width:64px;height:64px;border-radius:50%;border:0;background:#fffd;font-size:26px;box-shadow:0 4px 12px #0006;text-shadow:none}#runb.on{background:#ffd23f;box-shadow:0 0 0 4px #fff,0 4px 12px #0006}#mapt{top:94px;left:10px;padding:8px 12px;border:0;border-radius:10px;background:#0006;color:#fff;backdrop-filter:blur(4px);font-size:13px}#mm:not(.hide)+#mapt{top:98px;left:126px;padding:3px 9px;font-size:12px;background:#000a}#mm.big:not(.hide)+#mapt{left:236px}#anmute{display:block;margin:8px auto 0;padding:5px 12px;border:0;border-radius:10px;background:#0002;color:#5a3a00;font-size:12px;font-weight:600}</style></head><body>
